<div class="w-full max-w-lg bg-surface-container-lowest rounded-xl shadow-sm p-6 sm:p-10 relative overflow-hidden"><div class="mb-6"><h1 class="font-headline-lg text-headline-lg text-on-surface font-semibold tracking-tight mb-1">Complete your profile</h1><p class="font-body-md text-body-md text-on-surface-variant">A few details will help personalize your Lumen experience.</p></div><form class="space-y-5" onsubmit="event.preventDefault();"><div class="space-y-1.5"><label class="block font-label-md text-label-md text-on-surface font-medium" for="fullName">Full name <span class="text-error">*</span></label><div class="relative"><input class="w-full h-11 px-3.5 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container" id="fullName" name="fullName" placeholder="e.g. Alex Morgan" required="" type="text" value=""/></div></div><div class="space-y-1.5"><label class="block font-label-md text-label-md text-on-surface font-medium" for="email">Email address <span class="text-error">*</span></label><div class="relative"><input class="w-full h-11 px-3.5 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container" id="email" name="email" placeholder="you@example.com" required="" type="email" value="alex.morgan@workmail.com"/></div></div><div class="space-y-2"><div class="flex items-center justify-between"><label class="block font-label-md text-label-md text-on-surface font-medium">Choose your role <span class="text-error">*</span></label><span class="font-body-sm text-body-sm text-on-surface-variant">Required</span></div><div class="grid grid-cols-1 gap-2.5"><label class="group relative flex items-start gap-3.5 p-3.5 rounded-lg bg-surface-container-lowest cursor-pointer transition-colors shadow-sm" id="role-reader-card"><input class="mt-1 w-4 h-4 text-primary-container accent-primary-container focus:ring-primary-container" name="accountRole" onchange="updateRoleSelection(this)" type="radio" value="reader"/><div class="min-w-0 flex-1"><div class="flex items-center gap-1.5"><span class="font-label-lg text-label-lg text-on-surface font-semibold">Reader</span><span class="material-symbols-outlined text-[16px] text-secondary">menu_book</span></div><p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Discover articles, participate in discussions, and take quizzes.</p></div></label><label class="group relative flex items-start gap-3.5 p-3.5 rounded-lg bg-surface-container-lowest cursor-pointer transition-colors shadow-sm" id="role-author-card"><input class="mt-1 w-4 h-4 text-primary-container accent-primary-container focus:ring-primary-container" name="accountRole" onchange="updateRoleSelection(this)" type="radio" value="author"/><div class="min-w-0 flex-1"><div class="flex items-center gap-1.5"><span class="font-label-lg text-label-lg text-on-surface font-semibold">Author</span><span class="material-symbols-outlined text-[16px] text-secondary">edit_note</span></div><p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Write articles, curate quizzes, and submit drafts directly into editorial workflows.</p></div></label></div></div><div class="space-y-1.5 pt-1"><div class="flex items-center justify-between"><label class="block font-label-md text-label-md text-on-surface font-medium" for="bio">Bio <span class="font-body-sm text-on-surface-variant font-normal">(Optional)</span></label><span class="font-body-sm text-body-sm text-on-surface-variant" id="bioCounter">0 / 160</span></div><textarea class="w-full p-3 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container resize-none" id="bio" maxlength="160" oninput="document.getElementById('bioCounter').innerText = this.value.length + ' / 160'" placeholder="Tell the community briefly about your background or interests..." rows="3"></textarea></div><div class="pt-4 space-y-3"><button class="w-full h-11 px-6 rounded-lg bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm transition-colors cursor-pointer" onclick="handleCompleteSetup()" type="button"><span>Complete Setup</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button><a class="w-full flex items-center justify-center gap-1.5 py-2 font-label-md text-label-md text-secondary hover:text-on-surface transition-colors" href="#"><span class="material-symbols-outlined text-[16px]">arrow_back</span><span>Back to Sign in options</span></a></div></form></div>
</div>
<script>
  function updateRoleSelection(radio) {
    const readerCard = document.getElementById('role-reader-card');
    const authorCard = document.getElementById('role-author-card');
    
    if (radio.value === 'reader') {
      readerCard.classList.add('bg-secondary-container/30');
      authorCard.classList.remove('bg-secondary-container/30');
    } else {
      authorCard.classList.add('bg-secondary-container/30');
      readerCard.classList.remove('bg-secondary-container/30');
    }
  }

  function handleCompleteSetup() {
    const fullNameInput = document.getElementById('fullName');
    if (!fullNameInput.value.trim()) {
      fullNameInput.focus();
      return;
    }
    const btn = event.currentTarget;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Setting up your workspace...';
    btn.disabled = true;
    setTimeout(() => {
      window.location.hash = '#editorial-dashboard';
    }, 900);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const checkedRadio = document.querySelector('input[name="accountRole"]:checked');
    if (checkedRadio) {
      updateRoleSelection(checkedRadio);
    }
  });
</script></main><footer class="w-full py-space-xl flex items-center justify-center"><div class="flex flex-wrap items-center justify-center gap-x-space-md gap-y-space-xs font-body-sm text-body-sm text-on-surface-variant"><span class="text-on-surface-variant">© Lumen Platform</span><span class="text-outline-variant">•</span><a class="hover:text-on-surface transition-colors" data-path="privacy-policy" href="#">Privacy</a><span class="text-outline-variant">•</span><a class="hover:text-on-surface transition-colors" data-path="terms-of-service" href="#">Terms</a></div></footer></body></html>
