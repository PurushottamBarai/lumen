<!DOCTYPE html>

<html class="h-full bg-slate-50" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="web_blank" name="shell-type"/>
<title>Create Account | Lumen CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
      }
      body {
        overscroll-behavior: none;
      }
    }
  </style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

    <!-- Lumen Favicons -->
    <link rel="icon" type="image/png" href="../assets/lumen-favicon.png">
    <link rel="shortcut icon" href="../assets/lumen-favicon.ico">
    <link rel="apple-touch-icon" href="../assets/lumen-touch-icon.png">

</head>
<body class="min-h-screen flex flex-col bg-[#F8FAFC] font-sans text-slate-800 antialiased">
<!-- Top Navbar -->
<header class="fixed top-0 left-0 right-0 h-16 w-full z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs flex items-center">
  <div class="h-16 w-full px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
    <a class="flex items-center gap-2.5 focus:outline-none hover:opacity-90 transition-opacity shrink-0" href="../articles/home.html">
      <img src="../assets/lumen_logo.png" alt="Lumen CMS" class="h-8 w-auto object-contain" />
    </a>
    <div class="flex items-center gap-3">
      <span class="text-xs text-slate-500 hidden sm:inline">Already have an account?</span>
      <a href="login.html" class="inline-flex items-center justify-center h-9 px-4 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold transition-colors shadow-xs">Sign In</a>
    </div>
  </div>
</header>

<!-- Centered Form Container Wrapper -->
<main class="w-full flex-1 flex flex-col items-center justify-center pt-24 pb-8 px-4 sm:px-6">
<!-- Registration Card -->
<div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
<!-- Heading & Subtitle -->
<div class="text-center mb-6">
<h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-1">Create your account</h1>
<p class="text-sm text-slate-500">Join Lumen to read, share, and contribute knowledge.</p>
</div>
<!-- OAuth Row (Google, GitHub, LinkedIn) -->
<div class="grid grid-cols-3 gap-3 mb-6">
<!-- Google -->
<button class="border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium py-2.5 px-2 rounded-lg flex items-center justify-center gap-2 transition-colors" type="button">
<svg class="w-4 h-4 shrink-0" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
<!-- GitHub -->
<button class="border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium py-2.5 px-2 rounded-lg flex items-center justify-center gap-2 transition-colors" type="button">
<svg class="w-4 h-4 shrink-0 fill-current text-slate-900" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
</svg>
<span>GitHub</span>
</button>
<!-- LinkedIn -->
<button class="border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium py-2.5 px-2 rounded-lg flex items-center justify-center gap-2 transition-colors" type="button">
<svg class="w-4 h-4 shrink-0 fill-[#0A66C2]" viewbox="0 0 24 24">
<path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.6 1.6 0 0 0 1.6-1.6 1.6 1.6 0 0 0-1.6-1.6 1.6 1.6 0 0 0-1.6 1.6 1.6 1.6 0 0 0 1.6 1.6m1.4 9.74v-8.37H5.06v8.37h2.8z"></path>
</svg>
<span>LinkedIn</span>
</button>
</div>
<!-- Divider -->
<div class="relative my-6">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-wider">
<span class="bg-white px-3 text-slate-400 font-medium">or sign up with email</span>
</div>
</div>
<!-- Registration Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Address -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" for="email">Email address</label>
<input class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" for="password">Password</label>
<div class="relative">
<input class="w-full px-3.5 py-2.5 pr-10 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" for="confirm-password">Confirm password</label>
<div class="relative">
<input class="w-full px-3.5 py-2.5 pr-10 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-colors" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" onclick="const cp = document.getElementById('confirm-password'); cp.type = cp.type === 'password' ? 'text' : 'password';" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- Primary Button -->
<button class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm shadow-sm transition-colors mt-2 focus:outline-none focus:ring-2 focus:ring-blue-600/30" type="submit">
          Create Account
        </button>
</form>
<!-- Bottom link -->
<div class="mt-6 text-center text-sm text-slate-500">
        Already have an account? 
        <a class="font-medium text-blue-600 hover:underline transition-colors ml-1" href="login.html">Sign in</a>
</div>
</div>
</div>
<!-- Footer -->
<footer class="w-full text-center mt-8 text-xs text-slate-400">
<div class="flex items-center justify-center gap-2">
<span>© Lumen Platform</span>
<span>•</span>
<a class="hover:text-slate-600 transition-colors" href="#">Privacy</a>
<span>•</span>
<a class="hover:text-slate-600 transition-colors" href="#">Terms</a>
</div>
</footer>
</body></html>
