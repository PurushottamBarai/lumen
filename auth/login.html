<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign in — Lumen</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#2563EB',
              hover: '#1d4ed8',
              navy: '#0B1C30',
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    }
  </style>
<meta content="web_blank" name="shell-type">
    <!-- Lumen Favicons -->
    <link rel="icon" type="image/png" href="../assets/lumen-favicon.png">
    <link rel="shortcut icon" href="../assets/lumen-favicon.ico">
    <link rel="apple-touch-icon" href="../assets/lumen-touch-icon.png">

</head>
<body class="bg-[#F8FAFC] font-sans text-slate-900 antialiased min-h-screen flex flex-col selection:bg-blue-100 selection:text-blue-900">
<!-- Top Navbar -->
<header class="fixed top-0 left-0 right-0 h-16 w-full z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs flex items-center">
  <div class="h-16 w-full px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
    <a class="flex items-center gap-2.5 focus:outline-none hover:opacity-90 transition-opacity shrink-0" href="../articles/home.html">
      <img src="../assets/lumen_logo.png" alt="Lumen CMS" class="h-8 w-auto object-contain" />
    </a>
    <div class="flex items-center gap-3">
      <span class="text-xs text-slate-500 hidden sm:inline">Don't have an account?</span>
      <a href="register.html" class="inline-flex items-center justify-center h-9 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold transition-colors shadow-xs">Create Account</a>
    </div>
  </div>
</header>

<main class="w-full flex-1 flex flex-col items-center justify-center pt-24 pb-8 px-4">
  <div class="w-full max-w-[400px] flex flex-col items-center">
  <!-- Card Container -->
  <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 p-8 sm:p-9">
    <!-- Lumen Brand Logo -->
    <div class="flex flex-col items-center mb-6"><img src="../assets/lumen_logo.png" alt="Lumen CMS" class="h-12 w-auto object-contain" /></div>

    <!-- Header Copy -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome back</h1>
      <p class="text-sm text-slate-500 mt-1.5">Sign in to continue to Lumen.</p>
    </div>

    <!-- Horizontal OAuth Provider Row -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <!-- Google -->
      <button type="button" onclick="simulateOAuth('google')" class="h-10 border border-slate-200 hover:border-slate-300 hover:bg-slate-50/80 rounded-lg flex items-center justify-center transition-colors shadow-sm bg-white" title="Continue with Google">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
        </svg>
      </button>
      <!-- GitHub -->
      <button type="button" onclick="simulateOAuth('github')" class="h-10 border border-slate-200 hover:border-slate-300 hover:bg-slate-50/80 rounded-lg flex items-center justify-center transition-colors shadow-sm bg-white text-slate-800" title="Continue with GitHub">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
        </svg>
      </button>
      <!-- LinkedIn -->
      <button type="button" onclick="simulateOAuth('linkedin')" class="h-10 border border-slate-200 hover:border-slate-300 hover:bg-slate-50/80 rounded-lg flex items-center justify-center transition-colors shadow-sm bg-white" title="Continue with LinkedIn">
        <svg class="w-4 h-4 fill-[#0A66C2]" viewBox="0 0 24 24">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"></path>
        </svg>
      </button>
    </div>

    <!-- Divider -->
    <div class="relative flex items-center justify-center mb-6">
      <div class="w-full border-t border-slate-200"></div>
      <span class="absolute bg-white px-3 text-[11px] font-semibold text-slate-400 tracking-wider uppercase">OR SIGN IN WITH EMAIL</span>
    </div>

    <!-- Email & Password Form -->
    <form onsubmit="event.preventDefault(); handleSubmit();" class="space-y-4">
      <!-- Email Field -->
      <div>
        <label for="email" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">EMAIL ADDRESS</label>
        <input type="email" id="email" required="" placeholder="name@example.com" class="w-full h-11 px-3.5 rounded-lg border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all">
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">PASSWORD</label>
        <div class="relative flex items-center">
          <input type="password" id="password" required="" placeholder="••••••••" class="w-full h-11 px-3.5 pr-10 rounded-lg border border-slate-200 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 transition-all">
          <button type="button" onclick="togglePassword()" class="absolute right-3 text-slate-400 hover:text-slate-600 transition-colors p-0.5 focus:outline-none">
            <span id="eye-icon" class="material-symbols-outlined text-[18px]">visibility</span>
          </button>
        </div>
      </div>

      <!-- Primary Action Button -->
      <button type="submit" id="submit-btn" class="w-full h-11 mt-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition-colors flex items-center justify-center shadow-sm">
        Sign In
      </button>
    </form>

    <!-- Bottom Link -->
    <div class="mt-6 pt-5 text-center border-t border-slate-100">
      <p class="text-xs text-slate-500">
        New to Lumen? 
        <a href="register.html" class="text-blue-600 font-medium hover:underline ml-1">Create an account</a>
      </p>
    </div>
  </div>

  <!-- Footer -->
  <p class="text-center text-xs text-slate-400 mt-6 tracking-wide">
    © Lumen Platform • Privacy • Terms
  </p>
</div></main>
<script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function handleSubmit() {
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>';
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }, 900);
    }
  </script>


</body></html>
